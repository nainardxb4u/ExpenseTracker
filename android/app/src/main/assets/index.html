<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Simple Grocery Tracker</title>
    <style>
        :root {
            --primary: #4CAF50;
            --danger: #f44336;
            --bg: #f4f4f9;
            --card: #ffffff;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            padding-bottom: 20px;
        }

        /* Header & Tabs */
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .tabs {
            display: flex;
            background: #ddd;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            background: #ddd;
            border: none;
            outline: none;
        }

        .tab.active {
            background: var(--card);
            border-bottom: 3px solid var(--primary);
        }

        /* Content Sections */
        .content {
            display: none;
            padding: 20px;
        }
        .content.active { display: block; }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button.add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Lists */
        ul { list-style: none; padding: 0; margin: 0; }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .item-row:last-child { border-bottom: none; }

        .item-row label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
            font-size: 18px;
        }

        .item-row input[type="checkbox"] {
            transform: scale(1.5);
        }

        .checked-item {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: transparent;
            color: #999;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        /* History Styling */
        .history-card {
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 10px;
            background: #fafafa;
        }

        .history-date {
            font-weight: bold;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .history-item {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .status-bought { color: var(--primary); }
        .status-missed { color: var(--danger); }

        /* Action Buttons */
        .action-area {
            margin-top: 20px;
            text-align: center;
        }

        .finish-btn {
            background: #333;
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .clear-history-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Grocery Mate</h2>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('current')">Current List</button>
        <button class="tab" onclick="switchTab('history')">History</button>
    </div>

    <div id="current" class="content active">
        <div class="input-group">
            <input type="text" id="newItem" placeholder="e.g. Milk, 2 cartons..." onkeypress="handleEnter(event)">
            <button class="add-btn" onclick="addItem()">Add</button>
        </div>

        <ul id="shoppingList">
            </ul>

        <div class="action-area" id="finishArea" style="display:none;">
            <button class="finish-btn" onclick="finishTrip()">Finish Shopping Trip</button>
            <p style="font-size: 0.8rem; color: #666; margin-top: 5px;">Moves items to history</p>
        </div>
    </div>

    <div id="history" class="content">
        <div id="historyLog">
            </div>
        <div style="text-align: center;">
            <button class="clear-history-btn" onclick="clearHistory()">Clear History</button>
        </div>
    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let currentList = JSON.parse(localStorage.getItem('groceryList')) || [];
    let historyLog = JSON.parse(localStorage.getItem('groceryHistory')) || [];

    // --- RENDER FUNCTIONS ---
    function renderList() {
        const listEl = document.getElementById('shoppingList');
        const finishArea = document.getElementById('finishArea');
        listEl.innerHTML = '';

        if (currentList.length > 0) {
            finishArea.style.display = 'block';
        } else {
            finishArea.style.display = 'none';
            listEl.innerHTML = '<p style="text-align:center; color:#999;">List is empty.</p>';
        }

        currentList.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'item-row';
            li.innerHTML = `
                <label class="${item.bought ? 'checked-item' : ''}">
                    <input type="checkbox" ${item.bought ? 'checked' : ''} onchange="toggleItem(${index})">
                    ${item.name}
                </label>
                <button class="delete-btn" onclick="deleteItem(${index})">&times;</button>
            `;
            listEl.appendChild(li);
        });
    }

    function renderHistory() {
        const historyEl = document.getElementById('historyLog');
        historyEl.innerHTML = '';

        if (historyLog.length === 0) {
            historyEl.innerHTML = '<p style="text-align:center; color:#999;">No past shopping trips.</p>';
            return;
        }

        // Show newest first
        [...historyLog].reverse().forEach(trip => {
            const div = document.createElement('div');
            div.className = 'history-card';
            
            let itemsHtml = '';
            trip.items.forEach(item => {
                const statusIcon = item.bought ? '✔ Bought' : '✘ Not Bought';
                const statusClass = item.bought ? 'status-bought' : 'status-missed';
                itemsHtml += `<div class="history-item">
                    <span class="${statusClass}">[${statusIcon}]</span> ${item.name}
                </div>`;
            });

            div.innerHTML = `
                <div class="history-date">${trip.date}</div>
                ${itemsHtml}
            `;
            historyEl.appendChild(div);
        });
    }

    // --- ACTIONS ---
    function addItem() {
        const input = document.getElementById('newItem');
        const name = input.value.trim();
        if (name) {
            currentList.push({ name: name, bought: false });
            input.value = '';
            saveData();
            renderList();
        }
    }

    function handleEnter(e) {
        if (e.key === 'Enter') addItem();
    }

    function deleteItem(index) {
        currentList.splice(index, 1);
        saveData();
        renderList();
    }

    function toggleItem(index) {
        currentList[index].bought = !currentList[index].bought;
        saveData();
        renderList();
    }

    function finishTrip() {
        if (confirm('Finish this trip? It will move current items to history.')) {
            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            // Save to history
            historyLog.push({
                date: dateStr,
                items: [...currentList] // Copy the array
            });

            // Clear current list
            currentList = [];
            
            saveData();
            renderList();
            renderHistory();
            switchTab('history');
        }
    }

    function clearHistory() {
        if(confirm("Delete all history logs?")) {
            historyLog = [];
            saveData();
            renderHistory();
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabName).classList.add('active');
        // Find button that calls this function to set active class (simple approach)
        const tabs = document.querySelectorAll('.tab');
        if(tabName === 'current') tabs[0].classList.add('active');
        else tabs[1].classList.add('active');
    }

    function saveData() {
        localStorage.setItem('groceryList', JSON.stringify(currentList));
        localStorage.setItem('groceryHistory', JSON.stringify(historyLog));
    }

    // Initial Render
    renderList();
    renderHistory();
</script>

</body>
</html>
